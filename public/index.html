<!-- public/index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoStock | Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container neumorphic">
        <div class="logo-area">
            <h1>NexoStock</h1>
            <p>Sistema de Inventario SaaS</p>
        </div>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" class="neumorphic-input" required autocomplete="off">
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="neumorphic-input" required>
            </div>
            
            <div id="error-message" class="error-text"></div>
            
            <button type="submit" class="neumorphic-btn primary">Ingresar</button>
        </form>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
